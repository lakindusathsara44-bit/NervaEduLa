name: Deploy NervaEdu to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Build the public frontend
        run: |
          mkdir -p _site
          cp -R public/. _site/
          node <<'NODE'
          const fs = require('node:fs');
          const subjects = require('./subjects.js');
          const catalog = {};
          for (const key of ['OL_NAMES', 'AL_NAMES', 'OL_SUBJECTS', 'AL_SUBJECTS', 'SCHOLARSHIP_NAMES', 'SCHOLARSHIP_SUBJECTS', 'EXAM_SUBJECTS']) {
            catalog[key] = subjects[key];
          }
          fs.writeFileSync('_site/assets/catalog.js', 'window.NERVAEDU_SUBJECTS = ' + JSON.stringify(catalog) + ';\\n');
          fs.writeFileSync('_site/.nojekyll', '');
          NODE
          test -s _site/index.html
          test -s _site/assets/nervaedu-app.js
          test -s _site/assets/catalog.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
