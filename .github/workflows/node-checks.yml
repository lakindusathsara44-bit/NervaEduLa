name: Node.js checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - bugfix/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Report dependency advisories
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const r = JSON.parse(require("node:fs").readFileSync("npm-audit.json", "utf8")); const v = r.metadata?.vulnerabilities || {}; console.log("Dependency audit summary:", JSON.stringify(v)); for (const [name, item] of Object.entries(r.vulnerabilities || {})) console.log(JSON.stringify({ name, severity: item.severity, range: item.range, direct: item.isDirect, fixAvailable: item.fixAvailable, via: item.via.map(v => typeof v === "string" ? v : { name: v.name, title: v.title, url: v.url }) }));'

      - name: Run syntax and regression tests
        run: npm test
