name: NervaEdu branch CI

on:
  push:
    branches:
      - fix/full-audit-2026
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Syntax and dependency check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: npm test
